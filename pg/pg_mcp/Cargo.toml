[package]
name = "pg_mcp"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "PostgreSQL extension: call Model Context Protocol servers from SQL"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg18"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
# ADR-002 pins pgrx 0.19.x. `supabase-wrappers` 0.1.28 is NOT a dependency here:
# it pins `pgrx = "=0.16.1"` exactly and pulls tokio, both of which conflict with
# ADR-002's own "pgrx 0.19" and "no tokio runtime inside the backend" rules, and
# 0.16.1 predates PostgreSQL 18 support. See pg/README.md "ADR-002 deviation".
pgrx = "=0.19.2"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` (IndexMap-backed Map) is load-bearing for PRD-8: the §4.2
# table column order and §4.3 function parameter order follow the *published*
# property order of the tool's JSON Schemas, which serde_json's default
# BTreeMap-backed Map would silently sort away.
serde_json = { version = "1.0", features = ["preserve_order"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json", "gzip"] }
url = "2.5"

[dev-dependencies]
pgrx-tests = "=0.19.2"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
