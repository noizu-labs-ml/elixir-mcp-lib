# Elixir CI (threat-model T-015) — the hex library's own test battery.
#
# Triggers: pull_request / push touching lib/**, test/**, priv/**, mix files,
# or this file.
#
# The suite gates itself: without MCP_OAUTH_TEST_DATABASE_URL the Store.Ecto
# conformance battery skips and `mix test` FAILS (see test/test_helper.exs —
# an incomplete run is a failing run by design). The Postgres service below
# satisfies that gate; `--include e2e --include slow` covers the rest of it.
# The tests build their own scratch schema — only the database must exist.
#
# Sharding: the battery is split with `mix test --partitions` so the full
# coverage command stays well under ~8 min per leg including setup/compile.
# Every shard passes the FULL coverage flags against its OWN database
# (noizu_mcp_test_<partition>): the DB batteries DROP/CREATE their tables in
# place, so two shards sharing one database would corrupt each other mid-run.
# Because each shard passes both the database URL and `--include e2e`, the
# test_helper's CoverageGateTest never arms — no MCP_SKIP_FULL_COVERAGE needed.
# pg_mcp (`--only pg_mcp`, PRD-10) is excluded by default everywhere and needs
# Docker + the layered extension image; it runs from pg_mcp.yml.

name: elixir

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "priv/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/elixir.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "priv/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/elixir.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Shard count. Keep in sync with `matrix.partition` and the
  # `--partitions` flag on the test step.
  PARTITIONS: "3"

jobs:
  test:
    name: test (elixir ${{ matrix.beam.elixir }} / otp ${{ matrix.beam.otp }} / shard ${{ matrix.partition }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keep the beam pair inside ONE nested object. An `include:` list
        # beside a plain `partition:` axis does NOT cross-product: GitHub
        # matched each include entry against the partition axis and the grid
        # collapsed to 3 jobs (a single beam leg — run 37555933504). The
        # nested object gives the full 2x3 = 6 jobs.
        beam:
          - { elixir: "1.18.4", otp: "27" } # Floor: mix.exs requires ~> 1.18
          - { elixir: "1.20.1", otp: "29" }
        partition: [1, 2, 3]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noizu_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: ${{ matrix.partition }}
      MCP_OAUTH_TEST_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/noizu_mcp_test_${{ matrix.partition }}"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ matrix.beam.elixir }}
          otp-version: ${{ matrix.beam.otp }}

      - name: Restore deps + build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          # Partition-keyed: _build may bake env (compile-time reads) and must
          # never cross shards — see fixture_persistence_db.ex.
          key: mix-${{ runner.os }}-${{ matrix.beam.elixir }}-${{ matrix.beam.otp }}-p${{ matrix.partition }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.beam.elixir }}-${{ matrix.beam.otp }}-p${{ matrix.partition }}-

      - name: Mix deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Per-shard database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "DROP DATABASE IF EXISTS noizu_mcp_test_${{ matrix.partition }};"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE noizu_mcp_test_${{ matrix.partition }};"

      # Full coverage: the helper's own gate demands the e2e battery, and a
      # Postgres is already running for the Store.Ecto battery. Each shard
      # runs ~1/3 of the test files (ExUnit file-level round-robin); all
      # batteries stay covered across the three shards.
      - name: Test suite (shard ${{ matrix.partition }})
        run: mix test --partitions 3 --include e2e --include slow


  ci-timing:
    # PR-run timing tracker (fleet standard). Warn-only: never blocks.
    # Thresholds are repo/org Variables PR_STEP_MAX_MINUTES / PR_RUN_MAX_MINUTES, defaults 4/7.
    needs: [test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Track timing thresholds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          STEP_MAX_MIN: ${{ vars.PR_STEP_MAX_MINUTES || '4' }}
          RUN_MAX_MIN: ${{ vars.PR_RUN_MAX_MINUTES || '7' }}
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          jobs_json=""
          for i in 1 2 3; do
            jobs_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100") && break
            sleep 5
          done
          [ -n "$jobs_json" ] || { echo "::warning title=CI timing::could not fetch run jobs"; exit 0; }
          {
            echo "## CI timing (thresholds: step ${STEP_MAX_MIN}m / run ${RUN_MAX_MIN}m)"
            echo
            echo "| job | step | duration | status |"
            echo "|---|---|---|---|"
          } >> "$SUMMARY"
          flagged=0
          steps_sum=0
          while IFS=$'\t' read -r job step start end; do
            [ -n "$job" ] || continue
            s=$(date -d "$start" +%s); e=$(date -d "$end" +%s)
            dur=$((e - s)); thr=$((STEP_MAX_MIN * 60))
            steps_sum=$((steps_sum + dur))
            if [ "$dur" -gt "$thr" ]; then
              flagged=$((flagged + 1))
              echo "::warning title=CI timing::\"$step\" (job: $job) took $((dur / 60))m$((dur % 60))s — over the ${STEP_MAX_MIN}m step threshold"
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ⚠️ over ${STEP_MAX_MIN}m |" >> "$SUMMARY"
            else
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ok |" >> "$SUMMARY"
            fi
          done < <(echo "$jobs_json" | jq -r '
            .jobs[] | select(.name | test("^(test)$")) | .name as $job |
            .steps[] | select(.status == "completed" and .conclusion != "skipped" and .conclusion != null) |
            [$job, .name, .started_at, .completed_at] | @tsv')
          start=$(date -d "$RUN_STARTED_AT" +%s); now=$(date +%s)
          wall=$((now - start)); run_thr=$((RUN_MAX_MIN * 60))
          echo
          echo "| **steps sum** | test jobs, work only | $((steps_sum / 60))m$((steps_sum % 60))s | $( [ "$steps_sum" -gt "$run_thr" ] && echo "⚠️ over ${RUN_MAX_MIN}m" || echo ok) |" >> "$SUMMARY"
          echo "| **wall clock** | queue + work | $((wall / 60))m$((wall % 60))s | info |" >> "$SUMMARY"
          if [ "$steps_sum" -gt "$run_thr" ]; then
            echo "::warning title=CI timing::acceptance steps sum to $((steps_sum / 60))m$((steps_sum % 60))s — over the ${RUN_MAX_MIN}m run threshold (wall clock: $((wall / 60))m)"
          fi
          echo; echo "_${flagged} step(s) over threshold._" >> "$SUMMARY"
