# Elixir CI (threat-model T-015) — the hex library's own test battery.
#
# Triggers: pull_request / push touching lib/**, test/**, priv/**, mix files,
# or this file.
#
# The suite gates itself: without MCP_OAUTH_TEST_DATABASE_URL the Store.Ecto
# conformance battery skips and `mix test` FAILS (see test/test_helper.exs —
# an incomplete run is a failing run by design). The Postgres service below
# satisfies that gate; `--include e2e --include slow` covers the rest of it.
# The tests build their own scratch schema — only the database must exist.
#
# Sharding: the battery is split with `mix test --partitions` so the full
# coverage command stays well under ~8 min per leg including setup/compile.
# Every shard passes the FULL coverage flags against its OWN database
# (noizu_mcp_test_<partition>): the DB batteries DROP/CREATE their tables in
# place, so two shards sharing one database would corrupt each other mid-run.
# Because each shard passes both the database URL and `--include e2e`, the
# test_helper's CoverageGateTest never arms — no MCP_SKIP_FULL_COVERAGE needed.
# pg_mcp (`--only pg_mcp`, PRD-10) is excluded by default everywhere and needs
# Docker + the layered extension image; it runs from pg_mcp.yml.

name: elixir

on:
  pull_request:
    paths:
      - "lib/**"
      - "test/**"
      - "priv/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/elixir.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "lib/**"
      - "test/**"
      - "priv/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/elixir.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Shard count. Keep in sync with `matrix.partition` and the
  # `--partitions` flag on the test step.
  PARTITIONS: "3"

jobs:
  test:
    name: test (elixir ${{ matrix.elixir }} / otp ${{ matrix.otp }} / shard ${{ matrix.partition }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
        include:
          # Floor: mix.exs requires ~> 1.18; 1.17 is outside the constraint.
          - elixir: "1.18.4"
            otp: "27"
          - elixir: "1.20.1"
            otp: "29"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noizu_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      MIX_TEST_PARTITION: ${{ matrix.partition }}
      MCP_OAUTH_TEST_DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/noizu_mcp_test_${{ matrix.partition }}"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps + build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Mix deps
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Per-shard database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "DROP DATABASE IF EXISTS noizu_mcp_test_${{ matrix.partition }};"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE noizu_mcp_test_${{ matrix.partition }};"

      # Full coverage: the helper's own gate demands the e2e battery, and a
      # Postgres is already running for the Store.Ecto battery. Each shard
      # runs ~1/3 of the test files (ExUnit file-level round-robin); all
      # batteries stay covered across the three shards.
      - name: Test suite (shard ${{ matrix.partition }})
        run: mix test --partitions 3 --include e2e --include slow
