name: mcp-fuse

on:
  pull_request:
    paths:
      - "fuse/**"
      - "Makefile"
      - ".tool-versions"
      - ".github/workflows/fuse.yml"
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'push' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: fuse/go.sum

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Linux build
        run: go build -o /tmp/mcp-fuse .

      - name: Install FUSE runtime
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Kernel mount smoke when runner exposes /dev/fuse
        run: |
          if test -c /dev/fuse; then
            sudo chmod a+rw /dev/fuse
            MCP_FUSE_MOUNT_TEST=1 go test -run TestMountedRootIntegration -v .
          else
            echo "::notice::Hosted runner has no /dev/fuse; kernel mount smoke skipped"
          fi

  compile-darwin-arm64:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    defaults:
      run:
        working-directory: fuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: fuse/go.sum
      - name: Compile darwin/arm64
        run: go build -o /tmp/mcp-fuse-darwin-arm64 .

  compile-windows-amd64:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: fuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: fuse/go.sum
      - name: Windows adapter regression tests (nocgo)
        run: go test ./...
      - name: Compile windows/amd64 (nocgo)
        run: go build -o mcp-fuse-windows-amd64.exe .

  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mcp-fuse-linux-amd64
          - os: ubuntu-24.04-arm
            artifact: mcp-fuse-linux-arm64
          - os: macos-14
            artifact: mcp-fuse-darwin-arm64
          - os: windows-latest
            artifact: mcp-fuse-windows-amd64.exe
          - os: windows-11-arm
            artifact: mcp-fuse-windows-arm64.exe
            optional: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # windows-11-arm is a hosted runner; if it cannot schedule, this cell
    # fails and we still publish whatever other artifacts succeeded.
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        working-directory: fuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: fuse/go.sum
      - name: Build ${{ matrix.artifact }}
        run: go build -o ${{ matrix.artifact }} .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: fuse/${{ matrix.artifact }}
          if-no-files-found: error

  publish-release:
    needs: release
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mcp-fuse-*
          path: dist
          merge-multiple: true
      - name: Attach binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/mcp-fuse-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no mcp-fuse artifacts downloaded"
            exit 1
          fi
          ls -l dist
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes || gh release view "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  linux-artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"
          cache-dependency-path: fuse/go.sum
      # Pure-Go FUSE (hanwen/go-fuse): CGO off, cross-compile both arches.
      - name: Cross-compile Linux binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../bin/mcp-fuse-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../bin/mcp-fuse-linux-arm64 .
      - name: Smoke-check binaries
        run: |
          file ../bin/mcp-fuse-linux-amd64 ../bin/mcp-fuse-linux-arm64
          ../bin/mcp-fuse-linux-amd64 --help >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-fuse-linux
          path: |
            bin/mcp-fuse-linux-amd64
            bin/mcp-fuse-linux-arm64
          if-no-files-found: error


  ci-timing:
    # PR-run timing tracker (fleet standard). Warn-only: never blocks.
    # Thresholds are repo/org Variables PR_STEP_MAX_MINUTES / PR_RUN_MAX_MINUTES, defaults 4/7.
    needs: [test]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Track timing thresholds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          STEP_MAX_MIN: ${{ vars.PR_STEP_MAX_MINUTES || '4' }}
          RUN_MAX_MIN: ${{ vars.PR_RUN_MAX_MINUTES || '7' }}
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          jobs_json=""
          for i in 1 2 3; do
            jobs_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100") && break
            sleep 5
          done
          [ -n "$jobs_json" ] || { echo "::warning title=CI timing::could not fetch run jobs"; exit 0; }
          {
            echo "## CI timing (thresholds: step ${STEP_MAX_MIN}m / run ${RUN_MAX_MIN}m)"
            echo
            echo "| job | step | duration | status |"
            echo "|---|---|---|---|"
          } >> "$SUMMARY"
          flagged=0
          steps_sum=0
          while IFS=$'\t' read -r job step start end; do
            [ -n "$job" ] || continue
            s=$(date -d "$start" +%s); e=$(date -d "$end" +%s)
            dur=$((e - s)); thr=$((STEP_MAX_MIN * 60))
            steps_sum=$((steps_sum + dur))
            if [ "$dur" -gt "$thr" ]; then
              flagged=$((flagged + 1))
              echo "::warning title=CI timing::\"$step\" (job: $job) took $((dur / 60))m$((dur % 60))s — over the ${STEP_MAX_MIN}m step threshold"
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ⚠️ over ${STEP_MAX_MIN}m |" >> "$SUMMARY"
            else
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ok |" >> "$SUMMARY"
            fi
          done < <(echo "$jobs_json" | jq -r '
            .jobs[] | select(.name | test("^(test)$")) | .name as $job |
            .steps[] | select(.status == "completed" and .conclusion != "skipped" and .conclusion != null) |
            [$job, .name, .started_at, .completed_at] | @tsv')
          start=$(date -d "$RUN_STARTED_AT" +%s); now=$(date +%s)
          wall=$((now - start)); run_thr=$((RUN_MAX_MIN * 60))
          echo
          echo "| **steps sum** | test jobs, work only | $((steps_sum / 60))m$((steps_sum % 60))s | $( [ "$steps_sum" -gt "$run_thr" ] && echo "⚠️ over ${RUN_MAX_MIN}m" || echo ok) |" >> "$SUMMARY"
          echo "| **wall clock** | queue + work | $((wall / 60))m$((wall % 60))s | info |" >> "$SUMMARY"
          if [ "$steps_sum" -gt "$run_thr" ]; then
            echo "::warning title=CI timing::acceptance steps sum to $((steps_sum / 60))m$((steps_sum % 60))s — over the ${RUN_MAX_MIN}m run threshold (wall clock: $((wall / 60))m)"
          fi
          echo; echo "_${flagged} step(s) over threshold._" >> "$SUMMARY"
